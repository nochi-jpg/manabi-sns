<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教育アプリポータル</title>
<meta name="description" content="小学校の先生がClaudeといっしょに作った学習ゲーム・学習アプリの入口。制作：K.nom">
<meta property="og:title" content="教育アプリポータル">
<meta property="og:description" content="小学校の先生がClaudeといっしょに作った学習ゲーム・学習アプリ（制作：K.nom）">
<meta property="og:image" content="https://nochi-jpg.github.io/manabi-sns/img/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/m_all.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=DotGothic16&display=swap">
<style>
/* layout: 1画面に収める。上＝名前、おたすけツール3本、ゲーム5本のアイコン、下＝えらんだアプリのくわしいカード。スクロールなし */
:root{
  --bg:#fff6e9; --panel:#ffffff; --ink:#2a2a5a; --sub:#6a6890; --line:#ece6f5;
  --pk:#ff5c9d; --sky:#1f9fdc; --mint:#22b07f; --lem:#ffd23f; --pur:#8b5cf6; --shu:#c8553d; --ora:#e8862a; --teal:#1b9a9a; --navy:#3d5bd9;
  --game:#ff5c9d; --tool:#1b9a9a;
  --dot:rgba(255,92,157,.10);
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-dot:"DotGothic16","M PLUS Rounded 1c",monospace;
  --shadow:0 4px 0 rgba(42,42,90,.10),0 10px 24px rgba(42,42,90,.12);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17163a; --panel:#24224f; --ink:#f1efff; --sub:#b4b1da; --line:#36346a; --dot:rgba(255,122,168,.10);
  --shadow:0 4px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) radial-gradient(var(--dot) 7px,transparent 8px) 0 0/34px 34px;color:var(--ink);font-family:var(--f-body);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  display:flex;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
[hidden]{display:none!important}
header{text-align:center}
header .kick{display:inline-block;font-family:var(--f-dot);font-size:12px;letter-spacing:.12em;background:var(--ink);color:var(--lem);border-radius:8px;padding:2px 10px}
header h1{margin:6px 0 0;font-size:21px;font-weight:800;line-height:1.3}
footer{font-size:11px;line-height:1.5;color:var(--sub);text-align:center}
/* カード（くわしく） */
.card{height:100%;min-height:0;min-width:0;grid-template-columns:minmax(0,1fr);background:var(--panel);border-radius:22px;box-shadow:var(--shadow);border:3px solid var(--c);padding:12px 14px 14px;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto;gap:9px;text-align:center;overflow:hidden}
.badge{justify-self:center;font-size:12px;font-weight:800;color:#fff;background:var(--c);border-radius:999px;padding:3px 12px}
.art{min-height:0;min-width:0;grid-template-columns:minmax(0,1fr);display:grid;grid-template-rows:minmax(0,1fr) minmax(0,.45fr);gap:6px;align-items:center}
.art.solo{grid-template-rows:minmax(0,1fr)}
.art .logo{display:block;width:100%;height:100%;min-height:0;object-fit:contain;filter:drop-shadow(0 6px 0 rgba(42,42,90,.12))}
.art .logo.paper{background:#fff;border-radius:14px;padding:8px;filter:none}
.art .ttl{display:grid;place-items:center;height:100%;overflow:hidden;min-height:0;border-radius:16px;background:var(--c);color:#fff;font-size:24px;font-weight:800;line-height:1.3;padding:8px}
.art .ttl small{display:block;font-size:14px}
.art .mons{display:flex;justify-content:center;gap:4px;height:100%;min-height:0;max-height:100px}
.art .mons img{height:100%;width:auto;max-width:31%;min-height:0;object-fit:contain}
.card h2{margin:0;font-size:18px;font-weight:800;text-wrap:balance;word-break:auto-phrase}
.card .desc{margin:0;font-size:13px;line-height:1.6;text-wrap:pretty;word-break:auto-phrase}
/* 将来 GitHub版／Canva版 の2つのボタンが入る場所（いまは1つ） */
.btns{display:grid;grid-template-columns:1fr;gap:8px}
.go{display:flex;align-items:center;justify-content:center;height:48px;border-radius:14px;background:var(--c);color:#fff;font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.nav{font-size:18px;font-weight:800;width:40px;height:40px;border-radius:50%;border:none;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex:none}
/* アイコンタイル */
.tile{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:4px;align-items:center;justify-items:center;min-height:0;height:100%;padding:6px 4px 6px;border-radius:16px;border:3px solid transparent;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;text-decoration:none;color:var(--ink)}
.tile .ic{width:100%;height:100%;min-height:0;object-fit:contain}
.tile .ic.paper{background:#fff;border-radius:8px}
.tile .ic.txt{display:grid;place-items:center;border-radius:10px;background:var(--c);color:#fff;font-weight:800;font-size:13px;line-height:1.2}
.tile b{font-size:12px;font-weight:800;line-height:1.2;height:2.4em;display:grid;place-items:center;text-align:center;word-break:auto-phrase}
.tile[aria-pressed="true"]{border-color:var(--c)}
.head2{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.head2 .chip{font-size:11px;color:#fff;border-radius:999px;padding:2px 10px}
@media (max-height:640px){header h1{font-size:18px}.card .desc{font-size:12px}.art .ttl{font-size:17px}.art .ttl small{font-size:11px}}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .22s ease}@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}}

.app{width:100%;max-width:460px;height:100%;max-height:860px;align-self:center;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:10px}
.sec{display:grid;gap:6px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;height:clamp(78px,12vh,104px)}
.row .tile{padding:4px 2px}
.row .tile b{font-size:11px}
.chip{background:var(--gc)}
.sub{font-size:11px;color:var(--sub);font-weight:500}
.tile .ic.txt{font-size:12px}
@media (max-height:700px){.card .mons{display:none}.card .art{grid-template-rows:minmax(0,1fr)}}
.card{grid-template-rows:auto minmax(0,1fr) auto auto auto}
footer br{display:block}
</style>
</head>
<body><div class="app">
<header><span class="kick">EDUCATION APPS</span><h1>教育アプリポータル</h1></header>
<section class="sec" id="st"></section>
<section class="sec" id="sg"></section>
<article class="card" id="card" aria-live="polite"></article>
<footer>制作：K.nom（個人制作・塾や教室ではありません）<br>学校の端末では、フィルターで開けないことがあります</footer>
</div>
<script>
const ITEMS=[
 {id:'dragon',kind:'game',name:'まなびドラゴン',short:'ドラゴン',no:'第1作',color:'var(--mint)',logo:'img/logo_dragon.webp',icon:'img/logo_dragon.webp',mons:[],
  for:'小学4〜6年',desc:'勉強して竜を育て、ラスボスに挑む。学習×ローグライト。6教科1184問、1日3回まで。',url:'https://nochi-jpg.github.io/manabi-dragon/',btn:'あそぶ'},
 {id:'battle',kind:'game',name:'まなびバトル',short:'バトル',no:'第2作・いちおし',color:'var(--pk)',logo:'img/logo_battle.webp',icon:'img/m_all.webp',mons:['m_kokugo','m_all','m_rika'],
  for:'小学4〜6年',desc:'5教科2500問に答えてモンスターを育て、ボスと戦う。友だちとQRで1台対戦。キャラはぜんぶ手描き。',url:'https://nochi-jpg.github.io/manabato/',btn:'あそぶ'},
 {id:'stadium',kind:'game',name:'まなびスタジアム',short:'スタジアム',no:'第3作・先生用',color:'var(--pur)',logo:'img/logo_stadium.webp',icon:'img/m_sansu.webp',mons:['m_sansu','m_eigo','m_shakai'],
  for:'先生用（電子黒板）',desc:'子どもの まなびバトルのQRを読みこんで、大画面で3Dの対戦を上映。クラス大会に。',url:'https://nochi-jpg.github.io/manasuta/',btn:'ひらく'},
 {id:'historia',kind:'game',name:'まなびヒストリア',short:'ヒストリア',no:'第4作',color:'var(--shu)',logo:'img/logo_historia.webp',paper:true,icon:'img/h_yuuki.webp',mons:['h_yuuki','h_honjii','h_tokei'],
  for:'小学6年・社会',desc:'タイムスリップして、ゆがめられた日本の歴史を正す。証言のおかしなところに「カード」をつきつける、歴史の追体験ゲーム。',url:'https://nochi-jpg.github.io/manabi-historia/',btn:'あそぶ'},
 {id:'life',kind:'game',name:'まなびライフ',short:'ライフ',no:'第5作',color:'var(--sky)',logo:'img/life_title.webp',paper:true,icon:'img/life_title.webp',iconPaper:true,mons:[],
  for:'小学5・6年・キャリア教育',desc:'日本のどこかに生まれた1人の人生を、0歳から最期まで。公的な統計にもとづく、超リアル人生シミュレーター。',url:'https://nochi-jpg.github.io/manabi-life/play/',btn:'あそぶ'},
 {id:'keisan',kind:'tool',name:'計算おたすけ君',short:'計算',no:'おたすけツール',color:'var(--ora)',ttl:'計算<br>おたすけ君',iconTxt:'計算',mons:['otasuke_chara'],
  for:'小学1年・計算',desc:'ブロック・数の線・さくらんぼで、くり上がり・くり下がりの考え方をおたすけ。問題に挑戦するモードもあり。',url:'https://nochi-jpg.github.io/otasuke-keisan/',btn:'つかう'},
 {id:'hissan',kind:'tool',name:'ひっ算おたすけ君',short:'ひっ算',no:'おたすけツール',color:'var(--teal)',ttl:'ひっ算<br>おたすけ君',iconTxt:'ひっ算',mons:['otasuke_chara'],
  for:'筆算',desc:'たし算・ひき算・かけ算・わり算の筆算を、答えは言わずに1段ずつおたすけ。さくらんぼ法や九九の表も見られる。',url:'https://daizou.my.canva.site/otasuke',btn:'つかう'},
 {id:'shousu',kind:'tool',name:'ひっ算おたすけ君（小数点あり）',short:'小数ひっ算',no:'おたすけツール',color:'var(--navy)',ttl:'ひっ算<br>おたすけ君<small>小数点あり版</small>',iconTxt:'小数<br>ひっ算',mons:['otasuke_chara'],
  for:'小数の筆算',desc:'ひっ算おたすけ君の、小数点がある計算に使える版。',url:'https://daizou.my.canva.site/otasukeshosu',btn:'つかう'}
];
const GROUPS={game:{label:'ゲーム',color:'var(--game)',lead:'あそびながら 勉強する'},tool:{label:'おたすけツール',color:'var(--tool)',lead:'授業や宿題で つかう'}};
const byKind=k=>ITEMS.filter(x=>x.kind===k);
const mk=(t,c,txt)=>{const e=document.createElement(t); if(c) e.className=c; if(txt!=null) e.textContent=txt; return e};
function fillCard(card,g){
  card.style.setProperty('--c',g.color); card.innerHTML='';
  const art=mk('div','art');
  if(g.logo){const lg=mk('img',g.paper?'logo paper':'logo'); lg.src=g.logo; lg.alt=g.name+' ロゴ'; art.append(lg);} else {const t=mk('div','ttl'); t.innerHTML='<span>'+g.ttl+'</span>'; art.append(t);}
  if(g.mons.length){const m=mk('div','mons'); g.mons.forEach(k=>{const im=mk('img'); im.src='img/'+k+'.webp'; im.alt=''; m.append(im)}); art.append(m)} else art.classList.add('solo');
  const btns=mk('div','btns'); const a=mk('a','go',g.btn+' ▶'); a.href=g.url; a.target='_blank'; a.rel='noopener'; btns.append(a);
  card.append(mk('span','badge',g.no+'｜'+g.for),art,mk('h2',null,g.name),mk('p','desc',g.desc),btns);
  card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
}
function makeTile(g,tag){
  const t=mk(tag||'button','tile'); t.style.setProperty('--c',g.color);
  if(g.iconTxt){const d=mk('div','ic txt'); d.innerHTML=g.iconTxt; t.append(d)} else {const im=mk('img','ic'+(g.iconPaper?' paper':'')); im.src=g.icon; im.alt=''; t.append(im)}
  t.append(mk('b',null,g.short)); return t;
}
function swipe(el,fn){let sx=null; el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true}); el.addEventListener('touchend',e=>{if(sx==null)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) fn(dx<0?1:-1); sx=null})}

const ORDER=[...byKind('tool'),...byKind('game')];
const h=location.hash.slice(1);
let cur=ORDER.find(g=>g.id===h)||ORDER[0];
function draw(){
  [['tool',st],['game',sg]].forEach(([k,el])=>{
    el.innerHTML=''; const hd=mk('div','head2'); const c=mk('span','chip',GROUPS[k].label); c.style.setProperty('--gc',GROUPS[k].color); hd.append(c,mk('span','sub',GROUPS[k].lead));
    const r=mk('div','row'); byKind(k).forEach(g=>{const t=makeTile(g); t.setAttribute('aria-pressed',String(g===cur)); t.setAttribute('aria-label',g.name); t.onclick=()=>{cur=g;draw()}; r.append(t)}); el.append(hd,r);
  });
  fillCard(card,cur);
}
swipe(card,d=>{const i=ORDER.indexOf(cur); cur=ORDER[(i+d+ORDER.length)%ORDER.length]; draw()});
draw();
</script>
</body>
</html>
