<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K.nomの教育アプリポータル</title>
<meta name="description" content="小学校の先生がClaudeといっしょに作った学習アプリ・学習ゲームの入口。制作：K.nom">
<meta property="og:title" content="K.nomの教育アプリポータル">
<meta property="og:description" content="小学校の先生がClaudeといっしょに作った学習アプリ・学習ゲーム（制作：K.nom）">
<meta property="og:image" content="https://nochi-jpg.github.io/manabi-sns/img/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/face.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#F7F5EF;transition:background .6s}
body{font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','BIZ UDPGothic','Meiryo',sans-serif;color:#1A1A1A}
button{font-family:inherit;color:#1A1A1A;-webkit-tap-highlight-color:transparent}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;flex:none;overflow:hidden;transform-origin:center center;background:#F7F5EF;transition:background .6s;word-break:auto-phrase;line-break:strict}
#stage.pc{width:1280px;height:720px}
#stage.sp{width:720px;height:1280px}
.nw{white-space:nowrap}

/* アニメーション（ことばじてんと同じ） */
@keyframes up{from{opacity:0;transform:translateY(28px)}}
@keyframes rise{from{opacity:0;transform:translateY(36px);filter:blur(10px)}}
@keyframes stepIn{from{opacity:0;transform:translateX(-24px)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(16px)}}
@keyframes swapR{from{opacity:0;transform:translateX(40px);filter:blur(6px)}}
@keyframes swapL{from{opacity:0;transform:translateX(-40px);filter:blur(6px)}}
.bounce{transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s cubic-bezier(.34,1.56,.64,1)}

/* ===== 階層1 タイトル ===== */
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.title h1{margin:0;font-weight:900;letter-spacing:.06em;display:flex;flex-wrap:wrap;justify-content:center;white-space:nowrap}
.ch{display:inline-block;animation:fade .8s ease backwards,fl 3.8s ease-in-out infinite}
.lead{font-size:20px;font-weight:700;opacity:.7;white-space:nowrap;animation:fade .8s ease .4s backwards}
.pbs{display:flex;gap:30px}
.pb{display:flex;align-items:center;justify-content:space-between;width:400px;height:112px;padding:0 24px 0 34px;border:2px solid #1A1A1A;border-radius:18px;background:#fff;cursor:pointer;text-align:left;animation:up .7s cubic-bezier(.22,1,.36,1) backwards}
.pb b{display:block;font-size:28px;font-weight:900;letter-spacing:.04em;white-space:nowrap}
.pb small{display:block;margin-top:6px;font-size:16px;font-weight:700;opacity:.65;white-space:nowrap}
.pb:hover{transform:translate(-4px,-4px);box-shadow:6px 6px 0 #1A1A1A}
.pb:active{transform:translate(2px,2px);box-shadow:0 0 0 #1A1A1A;transition-duration:.08s}
.arr{flex:none;width:44px;height:44px;border-radius:50%;background:var(--arr,#fff);border:2px solid #1A1A1A;display:flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.pb:hover .arr{transform:translateX(5px) rotate(-12deg)}
.face{width:96px;height:96px;border-radius:50%;border:2px solid #1A1A1A;background:#fff;object-fit:cover;animation:pop .6s cubic-bezier(.34,1.56,.64,1) .45s backwards,bob 3.6s ease-in-out 1.1s infinite}
.sp .face{width:110px;height:110px}
.marq{position:absolute;left:0;right:0;bottom:40px;height:104px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);animation:fade .8s ease .7s backwards}
.marq{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.marq.drag{cursor:grabbing}
.mtrack{display:flex;width:max-content;padding:10px 0 0 10px;will-change:transform}
.mi img{pointer-events:none;-webkit-user-drag:none}
.sp .marq{top:880px;bottom:auto;height:172px}
.sp .mi{width:256px;height:144px;margin-right:24px;border-radius:12px}
.mi{flex:none;width:144px;height:81px;margin-right:22px;padding:0;border:2px solid #1A1A1A;border-radius:10px;overflow:hidden;background:#fff;cursor:pointer}
.mi img{display:block;width:100%;height:100%;object-fit:cover}
.mi:hover{transform:translate(-3px,-3px);box-shadow:4px 4px 0 #1A1A1A}
.mi:active{transform:translate(1px,1px);box-shadow:0 0 0 #1A1A1A;transition-duration:.08s}
.credit{position:absolute;right:24px;bottom:14px;font-size:14px;font-weight:700;opacity:.75;white-space:nowrap}
.pc .title{padding-top:76px;gap:20px}
.pc .title h1{font-size:62px}
.pc .pbs{margin-top:16px}
.sp .title{padding-top:118px;gap:24px}
.sp .title h1{font-size:60px;width:640px;line-height:1.35}
.sp .lead{font-size:24px}
.sp .pbs{flex-direction:column;gap:26px;margin-top:20px}
.sp .pb{width:560px;height:132px}
.sp .pb b{font-size:32px}
.sp .pb small{font-size:19px}
.sp .credit{font-size:18px;bottom:24px}

/* ===== ヘッダー ===== */
.hd{position:absolute;left:40px;top:28px;right:40px;display:flex;align-items:center;gap:12px;z-index:5}
.hd .name{margin-left:16px;font-size:20px;font-weight:900;letter-spacing:.06em;flex:1;white-space:nowrap}
.ic{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid #1A1A1A;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,opacity .2s}
.ic:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 #1A1A1A}
.ic:active{transform:translate(1px,1px);box-shadow:0 0 0 #1A1A1A}
.ic:disabled{opacity:.3;cursor:default;transform:none;box-shadow:none}
.sp .hd{left:24px;right:24px;top:24px}
.sp .ic{width:60px;height:60px}
.sp .hd .name{font-size:22px}

/* ===== 道しるべ ===== */
.nav{position:absolute;display:flex}
.stp{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:0;height:44px;font-size:22px;font-weight:700;cursor:pointer;animation:stepIn .5s cubic-bezier(.22,1,.36,1) backwards;transition:transform .3s cubic-bezier(.34,1.56,.64,1);text-align:left;white-space:nowrap}
.stp:hover{transform:translateX(6px)}
.stp.cur{cursor:default;font-weight:900}
.stp.cur:hover{transform:none}
.sd{flex:none;width:18px;height:18px;margin:0 11px;border-radius:50%;background:#1A1A1A}
.stp.cur .sd{width:24px;height:24px;margin:0 8px;border:5px solid #1A1A1A;background:#fff}
.ghost{display:flex;align-items:center;gap:12px;height:44px;font-size:20px;font-weight:700;opacity:.55;white-space:nowrap;animation:stepIn .5s cubic-bezier(.22,1,.36,1) backwards}
.ghost .sd{background:transparent;border:2px dashed #1A1A1A}
.pc .nav{left:40px;top:136px;width:310px;flex-direction:column}
.pc .stl{max-width:250px;overflow:hidden;white-space:nowrap}
.pc .conn{display:block;width:0;height:26px;margin-left:19px;border-left:2px dotted #1A1A1A}
.sp .nav{left:24px;top:108px;right:24px;flex-direction:row;align-items:center;gap:0}
.sp .stp,.sp .ghost{font-size:21px;gap:4px}
.sp .stp.cur{font-size:21px}
.sp .sd{width:14px;height:14px;margin:0 6px}
.sp .stp.cur .sd{width:20px;height:20px;margin:0 4px;border-width:4px}
.sp .conn{display:block;width:26px;height:0;margin:0 6px;border-top:2px dotted #1A1A1A}
.sp .stl{max-width:250px;overflow:hidden;white-space:nowrap}
.pips{position:absolute;right:18px;top:300px;display:flex;flex-direction:column;align-items:center;gap:10px}
.pip{width:12px;height:12px;border-radius:6px;border:2px solid #1A1A1A;transition:height .4s cubic-bezier(.34,1.56,.64,1),background .3s}
.pip.done{background:#1A1A1A}
.pip.on{height:32px;background:#1A1A1A}
.sp .pips{display:none}

/* ===== 階層2 一覧 ===== */
.main{position:absolute;display:flex;flex-direction:column}
.pc .main{left:380px;top:108px;width:860px;gap:14px}
.sp .main{left:24px;top:176px;width:672px;gap:22px}
.mh{display:flex;align-items:flex-end;gap:16px;animation:rise .7s cubic-bezier(.22,1,.36,1) backwards}
.mh .tt{flex:1;min-width:0}
.mh h2{margin:0;font-size:32px;font-weight:900;letter-spacing:.04em;white-space:nowrap}
.mh p{margin:4px 0 0;font-size:16px;font-weight:700;opacity:.75;white-space:nowrap}
.sp .mh{flex-wrap:wrap}
.sp .mh .tt{flex-basis:100%}
.sp .fbs{margin-left:auto}
.sp .mh h2{font-size:44px}
.sp .mh p{font-size:20px}
.fbs{display:flex;gap:12px;flex:none}
.fb{display:flex;align-items:center;justify-content:center;gap:8px;width:150px;height:46px;border:2px solid #1A1A1A;border-radius:23px;background:#fff;font-size:17px;font-weight:900;white-space:nowrap;cursor:pointer;padding:0 10px}
.fb:hover{transform:translate(-3px,-3px);box-shadow:4px 4px 0 #1A1A1A}
.fb:active{transform:translate(1px,1px);box-shadow:0 0 0 #1A1A1A;transition-duration:.08s}
.fb.on{background:#1A1A1A;color:#fff}
.fb.on svg{stroke:#fff}
.sp .fb{width:156px;height:56px;border-radius:28px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(3,244px);gap:18px 30px}
.sp .grid{grid-template-columns:1fr;gap:16px}
/* カード（PC：上に絵／スマホ：Steam一覧風に横長） */
.cd{position:relative;border:2px solid #1A1A1A;border-radius:16px;background:#fff;cursor:pointer;padding:12px;text-align:left;animation:up .55s cubic-bezier(.22,1,.36,1) backwards}
.cd:hover{transform:translate(-4px,-4px);box-shadow:6px 6px 0 #1A1A1A}
.cd:active{transform:translate(2px,2px);box-shadow:0 0 0 #1A1A1A;transition-duration:.08s}
.cbar{position:absolute;left:22px;top:-2px;width:72px;height:8px;border-radius:0 0 3px 3px;background:var(--c);transition:width .4s cubic-bezier(.22,1,.36,1);z-index:1}
.cd:hover .cbar{width:120px}
.cth{display:block;width:216px;height:122px;object-fit:cover;border-radius:8px;border:2px solid #1A1A1A}
.cn{display:flex;align-items:center;margin-top:6px;font-size:18px;font-weight:900;white-space:nowrap;height:48px;line-height:1.3}
.cl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;height:40px}
.pc .cd .tag{font-size:13px}
.tag{font-size:14px;font-weight:700;padding:4px 10px;border-radius:12px;background:#F0EEE6;white-space:nowrap}
.cd .arr{width:40px;height:40px;background:var(--c)}
.cd:hover .arr{transform:translateX(5px) rotate(-12deg)}
.sp .cd{display:grid;grid-template-columns:240px 1fr;column-gap:20px;height:154px;padding:12px}
.sp .cth{width:240px;height:126px;grid-row:1/3}
.sp .cn{margin-top:4px;height:72px;font-size:28px;line-height:1.25}
.sp .cl{margin-top:0;align-self:end;height:48px}
.sp .tag{font-size:17px;padding:5px 12px}
.sp .cd .arr{width:48px;height:48px}
.pager{display:flex;align-items:center;gap:12px;flex:none}
.pager span{font-size:18px;font-weight:900;width:64px;text-align:center;white-space:nowrap}
.pc .pager .ic{width:46px;height:46px}
.sp .pager{justify-content:center}
.sp .pager span{font-size:24px;width:90px}
.empty{padding:60px 0;text-align:center;font-size:22px;font-weight:700;opacity:.7;animation:fade .5s ease}

/* ポップアップ */
.ov{position:absolute;inset:0;background:rgba(26,26,26,.35);display:flex;align-items:center;justify-content:center;z-index:20;animation:fade .2s ease}
.panel{width:760px;padding:32px 36px 36px;border:2px solid #1A1A1A;border-radius:22px;background:#fff;box-shadow:8px 8px 0 #1A1A1A;display:flex;flex-direction:column;gap:24px;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.panel h3{margin:0;font-size:28px;font-weight:900;white-space:nowrap}
.sgs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sg{height:56px;border:2px solid #1A1A1A;border-radius:28px;background:#fff;font-size:19px;font-weight:700;white-space:nowrap;cursor:pointer}
.sg:hover{transform:translate(-3px,-3px);box-shadow:4px 4px 0 #1A1A1A}
.sg:active{transform:translate(1px,1px);box-shadow:0 0 0 #1A1A1A;transition-duration:.08s}
.sg.on{background:#1A1A1A;color:#fff}
.prow{display:flex;justify-content:flex-end}
.sp .panel{width:640px}
.sp .sgs{grid-template-columns:repeat(3,1fr)}
.sp .sg{height:66px;font-size:22px;border-radius:33px}

/* ===== 階層3 紹介 ===== */
.pc .main.l3{left:380px;top:100px;width:860px;gap:0}
.sp .main.l3{left:24px;top:170px;width:672px;gap:0}
.gal{display:flex;align-items:center;justify-content:center;gap:14px;animation:rise .7s cubic-bezier(.22,1,.36,1) backwards}
.big{position:relative;border:2px solid #1A1A1A;border-radius:14px;overflow:hidden;background:#1A1A1A;flex:none}
.big{padding:0;cursor:zoom-in}
.big:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 #1A1A1A}
.big img{display:block;width:100%;height:100%;object-fit:cover}
.big img.r{animation:swapR .45s cubic-bezier(.22,1,.36,1)}
.big img.l{animation:swapL .45s cubic-bezier(.22,1,.36,1)}
/* 拡大表示 */
#zoom{z-index:30;background:rgba(26,26,26,.55)}
.zbox{display:flex;align-items:center;gap:16px;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.zimg{position:relative;flex:none;width:992px;height:558px;border:2px solid #1A1A1A;border-radius:14px;overflow:hidden;background:#1A1A1A;box-shadow:8px 8px 0 #1A1A1A}
.zimg img{display:block;width:100%;height:100%;object-fit:cover}
.zimg img.r{animation:swapR .45s cubic-bezier(.22,1,.36,1)}
.zimg img.l{animation:swapL .45s cubic-bezier(.22,1,.36,1)}
.zx{position:absolute;right:40px;top:20px}
.sp .zbox{flex-wrap:wrap;justify-content:center;width:688px;gap:28px}
.sp .zimg{order:-1;width:688px;height:387px}
.sp .zx{right:24px;top:24px}
.cnt{position:absolute;right:10px;bottom:10px;font-size:14px;font-weight:900;padding:3px 10px;border-radius:10px;background:#fff;border:2px solid #1A1A1A;white-space:nowrap}
.pc .big{width:640px;height:360px}
.sp .big{width:536px;height:302px}
.sp .gal .ic{width:56px;height:56px}
.thw{margin-top:12px}
.tv{display:flex;gap:8px;padding:6px;margin:-6px}
.tv.scr{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
.tv.scr::-webkit-scrollbar{display:none}
.th{flex:none;padding:0;border:2px solid #1A1A1A;border-radius:8px;overflow:hidden;cursor:pointer;background:#fff;opacity:.55;animation:up .5s cubic-bezier(.22,1,.36,1) backwards}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.th:hover{opacity:1;transform:translate(-2px,-2px);box-shadow:3px 3px 0 #1A1A1A}
.th.on{opacity:1;outline:3px solid #fff;outline-offset:-5px;box-shadow:3px 3px 0 #1A1A1A}
.pc .th{width:100px;height:56px}
.pc .tv{justify-content:center}
.pc .tv.scr{justify-content:flex-start}
.sp .tv.wrap{flex-wrap:wrap;gap:12px}
.sp .th{width:159px;height:89px}
/* 横向きの自作スクロールバー（ことばじてんと同じ見た目） */
.trk{position:relative;height:14px;margin-top:8px;cursor:pointer}
.trk::before{content:'';position:absolute;top:6px;left:0;right:0;height:2px;border-radius:1px;background:#1A1A1A;opacity:.35}
.thm{position:absolute;top:3px;left:0;height:8px;border-radius:4px;background:#1A1A1A;cursor:grab;touch-action:none}
.thm:active{cursor:grabbing}
.info{display:flex;gap:24px;align-items:flex-start;animation:rise .7s cubic-bezier(.22,1,.36,1) .12s backwards}
.pc .info{margin-top:12px;height:122px}
.sp .info{margin-top:26px;flex-direction:column;gap:20px}
.it{flex:1;min-width:0}
.it h2{margin:0;font-size:28px;font-weight:900;white-space:nowrap;line-height:1.3}
.tags{display:flex;gap:8px;margin-top:6px}
.it p{margin:8px 0 0;font-size:15px;font-weight:700;line-height:1.6}
.sp .it h2{font-size:36px}
.sp .tag{font-size:17px}
.sp .it p{font-size:20px;margin-top:12px}
.gos{display:flex;flex-direction:column;gap:12px;flex:none}
.go{display:flex;align-items:center;justify-content:space-between;width:250px;height:54px;padding:0 10px 0 22px;border:2px solid #1A1A1A;border-radius:27px;background:#fff;font-size:18px;font-weight:900;white-space:nowrap;text-decoration:none;color:#1A1A1A}
.go .arr{width:36px;height:36px;background:var(--c)}
.go:hover{transform:translate(-4px,-4px);box-shadow:5px 5px 0 #1A1A1A}
.go:hover .arr{transform:translateX(4px) rotate(-12deg)}
.go:active{transform:translate(2px,2px);box-shadow:0 0 0 #1A1A1A;transition-duration:.08s}
.go.off{background:#E4E1D8;color:#8C897F;border-color:#B5B2A8;cursor:default;pointer-events:none}
.go.off{justify-content:center;padding:0 16px}
.sp .gos{flex-direction:row;gap:20px}
.sp .go{width:326px;height:72px;border-radius:36px;font-size:22px}
.sp .go .arr{width:44px;height:44px}
.note{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;font-size:12px;font-weight:700;opacity:.6;white-space:nowrap}
.sp .note{font-size:16px;bottom:14px}
</style>
</head>
<body>
<div id="viewport"><div id="stage" class="pc"></div></div>
<script>
(() => {

  filt: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>'
};
const GROUP = {

};

const CANVA = false;

// 学年・教科は仮（先生に確認する）
const ITEMS = [
  { id: 'keisan', kind: 'tool', name: '計算おたすけ君', c: '#FFAD5C', n: 4, g: [1], s: ['算数'], gh: 'https://nochi-jpg.github.io/otasuke-keisan/', cv: 'https://daizou.my.canva.site/otasukeisan',

function nav() {
  const steps = [{ t: 'ポータル', st: { lv: 1 } }];

function render() {

function setSlide(n, d) {
  const x = IM[cur.id];
  slide = ((n - 1 + x.n) % x.n) + 1; dir = d;
  const b = document.getElementById('bigimg');
  b.className = ''; void b.offsetWidth; b.src = img(x.id, slide); b.className = d;
  document.getElementById('cnt').textContent = `${slide} / ${x.n}`;
  const z = document.getElementById('zimg');
  if (z) { z.className = ''; void z.offsetWidth; z.src = img(x.id, slide); z.className = d; document.getElementById('zcnt').textContent = `${slide} / ${x.n}`; }
  stage.querySelectorAll('.th').forEach(t => t.classList.toggle('on', +t.dataset.sl === slide));
  const tv = document.getElementById('tv');
  if (tv.classList.contains('scr')) {
    const t = tv.querySelector('.th.on');
    const l = t.offsetLeft - tv.offsetLeft, r = l + t.offsetWidth;
    if (l < tv.scrollLeft) tv.scrollTo({ left: l - 6, behavior: 'smooth' });
    else if (r > tv.scrollLeft + tv.clientWidth) tv.scrollTo({ left: r - tv.clientWidth + 6, behavior: 'smooth' });
  }
}

// 自作の横スクロールバー（つまみドラッグ・レールを押すとそこへ・ホイール）
function setupScroll() {
  const tv = document.getElementById('tv'), trk = document.getElementById('trk'), thm = document.getElementById('thm');
  if (!trk) return;
  const scale = () => stage.getBoundingClientRect().width / stage.offsetWidth;
  const sync = () => {
    const ratio = tv.clientWidth / tv.scrollWidth;
    const w = Math.max(40, trk.clientWidth * ratio);
    thm.style.width = w + 'px';
    const max = tv.scrollWidth - tv.clientWidth;
    thm.style.left = (max > 0 ? tv.scrollLeft / max : 0) * (trk.clientWidth - w) + 'px';
  };
  tv.addEventListener('scroll', sync); sync();
  tv.addEventListener('wheel', e => { e.preventDefault(); tv.scrollLeft += (Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX); }, { passive: false });
  trk.addEventListener('pointerdown', e => {
    if (e.target === thm) return;
    const r = trk.getBoundingClientRect(), k = scale();
    const p = ((e.clientX - r.left) / k - thm.offsetWidth / 2) / (trk.clientWidth - thm.offsetWidth);
    tv.scrollTo({ left: Math.max(0, Math.min(1, p)) * (tv.scrollWidth - tv.clientWidth), behavior: 'smooth' });
  });
  thm.addEventListener('pointerdown', e => {
    e.preventDefault(); thm.setPointerCapture(e.pointerId);
    const sx = e.clientX, sl = tv.scrollLeft, k = scale();
    const mv = ev => { const d = (ev.clientX - sx) / k; tv.scrollLeft = sl + d * (tv.scrollWidth - tv.clientWidth) / (trk.clientWidth - thm.offsetWidth); };
    const upf = () => { thm.removeEventListener('pointermove', mv); thm.removeEventListener('pointerup', upf); };
    thm.addEventListener('pointermove', mv); thm.addEventListener('pointerup', upf);
  });
}

// 下を流れるタイトル画面：右から左へ自動で流れる。ドラッグ・スワイプで左右に送れる（慣性つき）
let marqRaf = 0;
function setupMarq() {
  cancelAnimationFrame(marqRaf);
  const box = stage.querySelector('.marq'), tr = stage.querySelector('.mtrack');
  if (!box || !tr) return;
  const AUTO = -36;                 // ふだんの速さ（px/秒、マイナス＝左へ）
  let x = 0, v = AUTO, last = performance.now(), drag = null, hover = false, moved = 0;
  const half = () => tr.scrollWidth / 2;
  const scale = () => stage.getBoundingClientRect().width / stage.offsetWidth;
  const wrap = () => { const h = half(); if (h > 0) { while (x <= -h) x += h; while (x > 0) x -= h; } };
  const step = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!drag) {
      const target = hover ? 0 : AUTO;
      v += (target - v) * Math.min(1, dt * (Math.abs(v - target) > 60 ? 1.6 : 3));  // 慣性：だんだん ふだんの速さにもどる
      x += v * dt;
    }
    wrap(); tr.style.transform = `translateX(${x}px)`;
    if (stage.contains(box)) marqRaf = requestAnimationFrame(step); else if (setupMarq.off) setupMarq.off();
  };
  box.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') hover = true; });
  box.addEventListener('pointerleave', () => { hover = false; });
  box.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = { id: e.pointerId, px: e.clientX, t: performance.now(), vs: [] }; moved = 0; box.dataset.moved = '';
  });
  const move = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const now = performance.now(), dx = (e.clientX - drag.px) / scale();
    x += dx; moved += Math.abs(e.clientX - drag.px);
    if (moved > 10) { box.dataset.moved = '1'; box.classList.add('drag'); }
    drag.vs.push({ v: dx / Math.max(.001, (now - drag.t) / 1000), t: now }); drag.vs = drag.vs.filter(o => now - o.t < 100);
    drag.px = e.clientX; drag.t = now;
  };
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const now = performance.now(), vs = drag.vs.filter(o => now - o.t < 100);
    if (moved > 10) v = vs.length ? Math.max(-2400, Math.min(2400, vs.reduce((a, o) => a + o.v, 0) / vs.length)) : 0;
    drag = null; box.classList.remove('drag');
  };
  addEventListener('pointermove', move); addEventListener('pointerup', end); addEventListener('pointercancel', end);
  const off = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', end); removeEventListener('pointercancel', end); };
  setupMarq.off && setupMarq.off(); setupMarq.off = off;
  // ドラッグしたときは、指をはなしてもアプリを開かない
  box.addEventListener('click', e => { if (box.dataset.moved) { e.stopPropagation(); e.preventDefault(); } }, true);
  last = performance.now(); marqRaf = requestAnimationFrame(step);
}

// ボタンを押したときの音
const SE = new Audio('audio/se_click.mp3'); SE.preload = 'auto';
function se() { try { const a = SE.cloneNode(); a.volume = .6; const p = a.play(); if (p) p.catch(() => {}); } catch (e) {} }
document.addEventListener('click', e => {

function openPop(kind) {

    <div class="sgs"><button class="sg bounce${curV == null ? ' on' : ''}" data-v="">ぜんぶ</button>${opts.map(o => `<button class="sg bounce${curV === o ? ' on' : ''}" data-v="${o}">${isG ? o + '年' : o}</button>`).join('')}</div>

}
function openZoom() {
  const x = IM[cur.id];
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'zoom';
  ov.innerHTML = `<button class="ic zx" data-z="close" aria-label="とじる"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="zbox"><button class="ic" data-z="prev" aria-label="まえの画像">${IC.back}</button>
    <div class="zimg"><img id="zimg" src="${img(x.id, slide)}" alt="${x.name}の画面"><span class="cnt" id="zcnt">${slide} / ${x.n}</span></div>
    <button class="ic" data-z="next" aria-label="つぎの画像">${IC.fwd}</button></div>`;
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-z]');
    if (b && b.dataset.z === 'prev') return setSlide(slide - 1, 'l');
    if (b && b.dataset.z === 'next') return setSlide(slide + 1, 'r');
    if ((b && b.dataset.z === 'close') || e.target === ov) closeZoom();
  });
  stage.append(ov);
}
function closeZoom() { const z = document.getElementById('zoom'); if (z) z.remove(); }
function closePop() { const p = document.getElementById('pop'); if (p) p.remove(); }

stage.addEventListener('click', e => {
  if (e.target.closest('#pop') || e.target.closest('#zoom')) return;
  const t = e.target.closest('button'); if (!t) return;
  const a = t.dataset.a;
  if (a === 'back') return back();
  if (a === 'fwd') return fwd();
  if (a === 'home') return go({ lv: 1 });
  if (a === 'zoom') return openZoom();
  if (a === 'prev') return setSlide(slide - 1, 'l');
  if (a === 'next') return setSlide(slide + 1, 'r');
  if (t.dataset.kind) return go({ lv: 2, kind: t.dataset.kind });
  if (t.dataset.open) return go({ lv: 3, kind: IM[t.dataset.open].kind, id: t.dataset.open });
  if (t.dataset.crumb != null) return go(nav.steps[+t.dataset.crumb].st);
  if (t.dataset.f) return openPop(t.dataset.f);
  if (t.dataset.pg) { cur.pg = (cur.pg || 0) + +t.dataset.pg; return render(); }
  if (t.dataset.sl) return setSlide(+t.dataset.sl, +t.dataset.sl < slide ? 'l' : 'r');
});
addEventListener('keydown', e => {
  if (document.getElementById('pop')) { if (e.key === 'Escape') closePop(); return; }
  if (document.getElementById('zoom') && e.key === 'Escape') return closeZoom();
  if (cur.lv === 3 && e.key === 'ArrowLeft') setSlide(slide - 1, 'l');
  if (cur.lv === 3 && e.key === 'ArrowRight') setSlide(slide + 1, 'r');
});
// #battle などで、そのアプリの紹介にいきなり飛ぶ
const h0 = location.hash.slice(1);
if (IM[h0]) { backS.push({ lv: 1 }, { lv: 2, kind: IM[h0].kind }); cur = { lv: 3, kind: IM[h0].kind, id: h0 }; }
addEventListener('resize', layout);
render(); layout();
})();
</script>
